<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JENNA</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0a0612">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0a0612;color:#fff;height:100vh;height:100dvh;overflow:hidden}

        /* LOGIN */
        .login{display:flex;justify-content:center;align-items:center;height:100vh;background:radial-gradient(ellipse at center,#12081f,#0a0612 70%)}
        .login-box{background:rgba(15,10,30,0.95);border-radius:24px;border:1px solid rgba(255,100,150,0.15);padding:50px 40px;text-align:center;max-width:380px;width:90%}
        .login-box h1{font-size:36px;font-weight:700;background:linear-gradient(90deg,#ff6b9d,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
        .login-box .sub{color:#555;font-size:11px;letter-spacing:2px;margin-bottom:25px}
        .login-input{width:100%;padding:14px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,100,150,0.2);border-radius:12px;color:#fff;font-size:18px;text-align:center;letter-spacing:4px;outline:none;margin-bottom:18px}
        .login-input:focus{border-color:#ff6b9d}
        .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#ff6b9d,#c084fc);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:2px}
        .login-err{color:#ff4444;font-size:13px;margin-top:12px;display:none}

        /* MAIN APP */
        .app{display:none;height:100vh;height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 30% 40%,#12081f 0%,#0a0612 60%)}

        /* STARFIELD */
        .starfield{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
        .star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--dur) var(--del) infinite alternate}
        @keyframes twinkle{0%{opacity:0.1}100%{opacity:0.7}}

        /* LEFT - Avatar */
        .avatar-side{position:absolute;left:0;top:0;width:42%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
        .girl-container{transition:filter .5s;cursor:pointer}
        .girl-container.idle{animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 25px rgba(255,107,157,0.2))}
        .girl-container.listening{animation:breathe 2s ease-in-out infinite;filter:drop-shadow(0 0 35px rgba(255,107,157,0.35))}
        .girl-container.thinking{animation:breathe 1.2s ease-in-out infinite;filter:drop-shadow(0 0 35px rgba(192,132,252,0.35))}
        .girl-container.speaking{animation:bounce 0.4s ease-in-out infinite;filter:drop-shadow(0 0 40px rgba(255,107,157,0.45))}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
        .girl-svg{width:200px;height:300px}
        .state-label{margin-top:14px;font-size:10px;color:rgba(255,107,157,0.35);letter-spacing:3px;text-transform:uppercase}
        .tap-mic-hint{font-size:9px;color:rgba(255,255,255,0.15);margin-top:6px;letter-spacing:1px}

        /* RIGHT - Chat */
        .chat-side{position:absolute;right:0;top:0;width:58%;height:100%;display:flex;flex-direction:column;z-index:10}
        .chat-header{padding:14px 14px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.03)}
        .chat-header .dot{width:7px;height:7px;border-radius:50%;background:#ff6b9d;box-shadow:0 0 8px #ff6b9d}
        .chat-header .title{font-size:13px;color:rgba(255,255,255,0.5);letter-spacing:2px}
        .clear-btn{margin-left:auto;padding:3px 8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:#444;font-size:9px;cursor:pointer}

        .chat-log{flex:1;overflow-y:auto;padding:10px 12px}
        .chat-log::-webkit-scrollbar{width:2px}
        .chat-log::-webkit-scrollbar-thumb{background:rgba(255,107,157,0.1);border-radius:2px}
        .log-entry{margin-bottom:5px;padding:6px 10px;border-radius:10px;font-size:11.5px;line-height:1.4;max-width:88%;animation:fadeUp .3s}
        @keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
        .log-entry.user{margin-left:auto;background:rgba(255,107,157,0.1);border:1px solid rgba(255,107,157,0.12)}
        .log-entry.jenna{background:rgba(192,132,252,0.06);border:1px solid rgba(192,132,252,0.08)}

        /* Quick actions */
        .quick-actions{padding:4px 12px;display:flex;gap:6px;overflow-x:auto}
        .quick-actions::-webkit-scrollbar{display:none}
        .quick-btn{padding:5px 10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:14px;color:rgba(255,255,255,0.4);font-size:10px;white-space:nowrap;cursor:pointer;transition:all .2s}
        .quick-btn:active{background:rgba(255,107,157,0.1);border-color:rgba(255,107,157,0.2);color:#ff6b9d}

        .input-bar{padding:8px 10px;display:flex;gap:6px;align-items:center;border-top:1px solid rgba(255,255,255,0.04)}
        .input-bar input{flex:1;padding:9px 12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:18px;color:#fff;font-size:12px;outline:none}
        .input-bar input::placeholder{color:#444}
        .input-bar .send{width:34px;height:34px;border-radius:50%;border:none;background:linear-gradient(135deg,#ff6b9d,#c084fc);color:#fff;font-size:13px;cursor:pointer;flex-shrink:0}

        /* Waveform */
        .waveform{display:flex;align-items:center;gap:2px;height:20px;padding:0 12px}
        .wave-bar{width:3px;border-radius:2px;background:#ff6b9d;transition:height .1s}

        /* Mobile */
        @media(max-width:600px){
            .avatar-side{width:100%;height:32%;position:relative}
            .chat-side{width:100%;height:68%;position:relative}
            .girl-svg{width:120px;height:180px}
        }
    </style>
</head>
<body>
    <div class="login" id="loginScreen">
        <div class="login-box">
            <h1>JENNA</h1>
            <p class="sub">YOUR PERSONAL AI ASSISTANT</p>
            <input type="password" class="login-input" id="pwdInput" placeholder="PASSWORD" onkeypress="if(event.key==='Enter')doLogin()">
            <button class="login-btn" onclick="doLogin()">ENTER</button>
            <div class="login-err" id="loginErr">ACCESS DENIED</div>
        </div>
    </div>

    <div class="app" id="app">
        <div class="starfield" id="starfield"></div>

        <!-- LEFT: Avatar -->
        <div class="avatar-side">
            <div class="girl-container idle" id="girlContainer" onclick="toggleMic()">
                <svg class="girl-svg" viewBox="0 0 220 320" fill="none">
                    <!-- Hair -->
                    <ellipse cx="110" cy="85" rx="55" ry="50" fill="#2a1a2e"/>
                    <path d="M55 85 Q55 35 110 30 Q165 35 165 85 Q165 75 155 65 Q140 50 110 48 Q80 50 65 65 Q55 75 55 85Z" fill="#1a0e1e"/>
                    <path d="M60 70 Q70 50 90 55 Q80 65 75 75Z" fill="#2a1a2e"/>
                    <path d="M160 70 Q150 50 130 55 Q140 65 145 75Z" fill="#2a1a2e"/>
                    <!-- Neck -->
                    <rect x="100" y="125" width="20" height="20" rx="4" fill="#f5d0c5"/>
                    <!-- Dress -->
                    <path d="M70 145 Q70 135 90 130 L130 130 Q150 135 150 145 L155 230 Q155 245 110 250 Q65 245 65 230Z" fill="url(#dressGrad)"/>
                    <path d="M80 145 Q80 140 95 137 L110 137 L108 220 Q85 215 80 200Z" fill="white" opacity="0.06"/>
                    <!-- Arms -->
                    <path d="M70 150 Q50 170 45 200 Q42 210 50 212 Q55 210 55 200 Q58 180 72 160Z" fill="#f5d0c5"/>
                    <path d="M150 150 Q170 170 175 200 Q178 210 170 212 Q165 210 165 200 Q162 180 148 160Z" fill="#f5d0c5"/>
                    <circle cx="48" cy="212" r="6" fill="#f5d0c5"/>
                    <circle cx="172" cy="212" r="6" fill="#f5d0c5"/>
                    <!-- Legs -->
                    <rect x="90" y="248" width="14" height="40" rx="7" fill="#f5d0c5"/>
                    <rect x="116" y="248" width="14" height="40" rx="7" fill="#f5d0c5"/>
                    <ellipse cx="97" cy="292" rx="10" ry="6" fill="#ff6b9d"/>
                    <ellipse cx="123" cy="292" rx="10" ry="6" fill="#ff6b9d"/>
                    <!-- Head -->
                    <ellipse cx="110" cy="85" rx="48" ry="45" fill="#f5d0c5"/>
                    <circle cx="78" cy="92" r="8" fill="#ffb3c6" opacity="0.35"/>
                    <circle cx="142" cy="92" r="8" fill="#ffb3c6" opacity="0.35"/>
                    <!-- Eyes -->
                    <g id="eyes">
                        <ellipse cx="92" cy="85" rx="7" ry="8" fill="#1a0a20"/>
                        <ellipse cx="128" cy="85" rx="7" ry="8" fill="#1a0a20"/>
                        <circle cx="89" cy="82" r="2.5" fill="white" opacity="0.8"/>
                        <circle cx="125" cy="82" r="2.5" fill="white" opacity="0.8"/>
                        <ellipse id="leftBlink" cx="92" cy="85" rx="8" ry="0" fill="#f5d0c5"/>
                        <ellipse id="rightBlink" cx="128" cy="85" rx="8" ry="0" fill="#f5d0c5"/>
                    </g>
                    <!-- Eyebrows -->
                    <path id="leftBrow" d="M82 74 Q92 70 100 74" stroke="#2a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <path id="rightBrow" d="M120 74 Q128 70 138 74" stroke="#2a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <!-- Mouth -->
                    <path id="mouth" d="M100 100 Q110 106 120 100" stroke="#cc5577" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <ellipse id="mouthOpen" cx="110" cy="102" rx="8" ry="0" fill="#cc5577" opacity="0.7"/>
                    <defs>
                        <linearGradient id="dressGrad" x1="110" y1="130" x2="110" y2="250">
                            <stop offset="0%" stop-color="#ff6b9d"/>
                            <stop offset="100%" stop-color="#c03060"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="state-label" id="stateLabel">READY</div>
            <div class="tap-mic-hint">TAP TO SPEAK</div>
        </div>

        <!-- RIGHT: Chat -->
        <div class="chat-side">
            <div class="chat-header">
                <div class="dot"></div>
                <div class="title">JENNA</div>
                <button class="clear-btn" onclick="clearChat()">CLEAR</button>
            </div>
            <div class="chat-log" id="chatLog">
                <div class="log-entry jenna">Hey Joss! I'm Jenna 💜 Your personal AI assistant. Ask me anything — weather, jokes, quotes, or just chat!</div>
            </div>
            <div class="quick-actions">
                <div class="quick-btn" onclick="quickSend('What\'s the weather?')">🌤️ Weather</div>
                <div class="quick-btn" onclick="quickSend('Tell me a joke')">😄 Joke</div>
                <div class="quick-btn" onclick="quickSend('Give me a quote')">✨ Quote</div>
                <div class="quick-btn" onclick="quickSend('Who are you?')">🤖 About</div>
                <div class="quick-btn" onclick="quickSend('What can you do?')">💡 Help</div>
            </div>
            <div class="waveform" id="waveform"></div>
            <div class="input-bar">
                <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendText()">
                <button class="send" onclick="sendText()">➤</button>
            </div>
        </div>
    </div>

    <script>
    let PWD='',speaking=false,currentAudio=null,speechRec=null,recording=false;
    let audioCtx=null,analyser=null,micStream=null;

    // ===== STARFIELD =====
    (function(){
        const sf=document.getElementById('starfield');
        for(let i=0;i<50;i++){
            const s=document.createElement('div');s.className='star';
            s.style.cssText=`top:${Math.random()*100}%;left:${Math.random()*100}%;width:${0.5+Math.random()*1.5}px;height:${0.5+Math.random()*1.5}px;--dur:${2+Math.random()*3}s;--del:${Math.random()*4}s`;
            sf.appendChild(s);
        }
    })();

    // ===== WAVEFORM =====
    (function(){
        const wf=document.getElementById('waveform');
        for(let i=0;i<20;i++){const b=document.createElement('div');b.className='wave-bar';b.style.height='2px';wf.appendChild(b)}
    })();

    function animateWave(active){
        if(!active){document.querySelectorAll('.wave-bar').forEach(b=>b.style.height='2px');return}
        document.querySelectorAll('.wave-bar').forEach(b=>{
            b.style.height=(2+Math.random()*16)+'px';
        });
        if(speaking||recording)requestAnimationFrame(()=>setTimeout(()=>animateWave(true),80));
    }

    // ===== BLINK =====
    setInterval(()=>{
        const lb=document.getElementById('leftBlink'),rb=document.getElementById('rightBlink');
        if(!lb||!rb)return;
        lb.setAttribute('ry','8');rb.setAttribute('ry','8');
        setTimeout(()=>{lb.setAttribute('ry','0');rb.setAttribute('ry','0')},150);
    },3500);

    // ===== MOUTH =====
    let mouthAnim=null;
    function startMouth(){
        const mouth=document.getElementById('mouth'),open=document.getElementById('mouthOpen');
        if(!mouth||!open)return;let f=0;
        mouthAnim=setInterval(()=>{
            f++;
            if(f%2===0){mouth.setAttribute('d','M100 100 Q110 108 120 100');open.setAttribute('ry','5')}
            else{mouth.setAttribute('d','M100 100 Q110 103 120 100');open.setAttribute('ry','2')}
        },180);
    }
    function stopMouth(){
        if(mouthAnim){clearInterval(mouthAnim);mouthAnim=null}
        const mouth=document.getElementById('mouth'),open=document.getElementById('mouthOpen');
        if(mouth)mouth.setAttribute('d','M100 100 Q110 106 120 100');
        if(open)open.setAttribute('ry','0');
    }

    // ===== LOGIN =====
    function doLogin(){
        const p=document.getElementById('pwdInput').value;if(!p)return;
        fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})})
        .then(r=>{if(r.ok){PWD=p;localStorage.setItem('jenna_pwd',p);document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';initSpeech()}
        else{document.getElementById('loginErr').style.display='block';document.getElementById('pwdInput').value=''}});
    }
    window.addEventListener('load',()=>{
        const s=localStorage.getItem('jenna_pwd');
        if(s){PWD=s;fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:s})})
        .then(r=>{if(r.ok){document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';initSpeech()}else localStorage.removeItem('jenna_pwd')})}
    });

    // ===== SPEECH =====
    function initSpeech(){
        try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=256}catch(e){}
        const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        if(!SR)return;
        speechRec=new SR();speechRec.continuous=false;speechRec.interimResults=true;speechRec.lang='en-US';
        speechRec.onresult=e=>{
            for(let i=e.resultIndex;i<e.results.length;i++){
                if(e.results[i].isFinal){
                    const text=e.results[i][0].transcript.trim();
                    if(text){addLog('user',text);setGirlState('thinking');getResponse(text)}
                }
            }
        };
        speechRec.onend=()=>{recording=false;animateWave(false);setGirlState('idle')};
        speechRec.onerror=()=>{recording=false;animateWave(false);setGirlState('idle')};
    }

    function toggleMic(){
        if(speaking){stopSpeaking();return}
        if(recording){try{speechRec.stop()}catch(e){}recording=false;animateWave(false);setGirlState('idle');return}
        if(!speechRec){addLog('jenna','🎤 Voice not supported here. Type below!');return}
        navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
            micStream=stream;recording=true;setGirlState('listening');animateWave(true);
            try{speechRec.start()}catch(e){recording=false;animateWave(false);setGirlState('idle')}
            setTimeout(()=>{if(recording)try{speechRec.stop()}catch(e){}},12000);
        }).catch(()=>addLog('jenna','🎤 Mic permission denied. Type below!'));
    }

    function quickSend(text){addLog('user',text);setGirlState('thinking');getResponse(text)}

    // ===== AVATAR STATE =====
    function setGirlState(state){
        document.getElementById('girlContainer').className='girl-container '+state;
        const s=document.getElementById('stateLabel');
        s.textContent=state.toUpperCase();
        s.style.color=state==='speaking'?'rgba(255,107,157,0.6)':state==='thinking'?'rgba(192,132,252,0.6)':'rgba(255,107,157,0.35)';
        const lb=document.getElementById('leftBrow'),rb=document.getElementById('rightBrow');
        if(state==='thinking'){lb.setAttribute('d','M82 72 Q92 68 100 74');rb.setAttribute('d','M120 74 Q128 68 138 72')}
        else{lb.setAttribute('d','M82 74 Q92 70 100 74');rb.setAttribute('d','M120 74 Q128 70 138 74')}
    }

    // ===== CHAT =====
    function sendText(){
        const inp=document.getElementById('chatInput');const m=inp.value.trim();if(!m)return;inp.value='';
        addLog('user',m);setGirlState('thinking');getResponse(m);
    }
    function getResponse(msg){
        fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,password:PWD})})
        .then(r=>r.json()).then(d=>{addLog('jenna',d.response);speak(d.response)})
        .catch(()=>{addLog('jenna','⚠️ Connection error. Try again!');setGirlState('idle')});
    }
    function addLog(s,t){
        const log=document.getElementById('chatLog');
        const d=document.createElement('div');d.className='log-entry '+s;
        const time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        d.innerHTML=t+' <span style="font-size:9px;opacity:0.3;margin-left:6px">'+time+'</span>';
        log.appendChild(d);log.scrollTop=log.scrollHeight;
    }

    // ===== TTS =====
    function speak(text){
        speaking=true;setGirlState('speaking');startMouth();animateWave(true);
        fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,password:PWD})})
        .then(r=>{if(!r.ok)throw Error();return r.blob()})
        .then(blob=>{const url=URL.createObjectURL(blob);currentAudio=new Audio(url);
            currentAudio.onend=()=>{stopSpeaking();URL.revokeObjectURL(url)};
            currentAudio.onerror=()=>{stopSpeaking();browserTTS(text)};
            currentAudio.play();})
        .catch(()=>browserTTS(text));
    }
    function browserTTS(text){
        if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(text);u.rate=1.05;u.pitch=1.15;u.onend=()=>stopSpeaking();window.speechSynthesis.speak(u)}else stopSpeaking();
    }
    function stopSpeaking(){
        speaking=false;stopMouth();animateWave(false);setGirlState('idle');
        if(currentAudio){currentAudio.pause();currentAudio=null}
        if(window.speechSynthesis)window.speechSynthesis.cancel();
    }
    function clearChat(){
        document.getElementById('chatLog').innerHTML='';addLog('jenna','Fresh start! Ask me anything! 💜');
        fetch('/api/clear-memory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:PWD})});
    }
    </script>
</body>
</html>
