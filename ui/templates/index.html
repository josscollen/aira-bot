<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRA</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0f0f23 100%);
            color: #fff;
            min-height: 100vh;
        }
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        }
        .bg-animation::before {
            content: '';
            position: absolute; width: 150%; height: 150%; top: -50%; left: -50%;
            background: radial-gradient(ellipse at center, rgba(0,212,255,0.03) 0%, transparent 70%);
            animation: rotate 60s linear infinite;
        }
        @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Login Screen */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            background: rgba(20, 20, 40, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 50px 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .login-avatar {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #00d4ff, #8a2be2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; margin: 0 auto 20px;
            animation: glow 3s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0,212,255,0.5); }
            50% { box-shadow: 0 0 40px rgba(138,43,226,0.8); }
        }
        .login-box h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            background: linear-gradient(90deg, #00d4ff, #8a2be2);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .login-box p { color: #888; margin-bottom: 30px; }
        .login-input {
            width: 100%; padding: 16px 20px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 12px; color: #fff;
            font-family: 'Rajdhani', sans-serif; font-size: 18px;
            outline: none; margin-bottom: 20px;
            text-align: center; letter-spacing: 4px;
        }
        .login-input:focus { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.3); }
        .login-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none; border-radius: 12px;
            color: #fff; font-family: 'Orbitron', sans-serif;
            font-size: 16px; cursor: pointer;
            transition: all 0.3s ease;
        }
        .login-btn:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(0,212,255,0.5); }
        .login-error { color: #ff4444; margin-top: 15px; display: none; }

        /* Chat Screen */
        .chat-screen { display: none; }
        .header {
            background: rgba(10,10,26,0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,212,255,0.2);
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
        }
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo-icon {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, #00d4ff, #8a2be2);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0,212,255,0.5); }
            50% { box-shadow: 0 0 40px rgba(0,212,255,0.8); }
        }
        .logo-text {
            font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900;
            background: linear-gradient(90deg, #00d4ff, #8a2be2, #00ff88);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .status-badge {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 16px; background: rgba(0,255,136,0.1);
            border: 1px solid rgba(0,255,136,0.3); border-radius: 20px;
            font-size: 14px; color: #00ff88;
        }
        .status-dot {
            width: 8px; height: 8px; background: #00ff88;
            border-radius: 50%; animation: blink 1.5s ease-in-out infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        .chat-container { display: flex; flex-direction: column; height: calc(100vh - 140px); }
        .chat-header {
            background: rgba(20,20,40,0.8); backdrop-filter: blur(10px);
            border-radius: 20px 20px 0 0; border: 1px solid rgba(0,212,255,0.1);
            border-bottom: none; padding: 20px; display: flex; align-items: center; gap: 15px;
        }
        .aira-avatar {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #00d4ff, #8a2be2);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 28px; animation: glow 3s ease-in-out infinite;
        }
        .aira-info h2 { font-family: 'Orbitron', sans-serif; font-size: 20px; }
        .aira-info p { font-size: 14px; color: #888; }
        .chat-messages {
            flex: 1; background: rgba(15,15,35,0.9); backdrop-filter: blur(10px);
            border-left: 1px solid rgba(0,212,255,0.1); border-right: 1px solid rgba(0,212,255,0.1);
            padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
        }
        .message {
            max-width: 80%; padding: 15px 20px; border-radius: 18px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; background: linear-gradient(135deg, #00d4ff, #0099cc); border-bottom-right-radius: 5px; }
        .message.aira { align-self: flex-start; background: rgba(138,43,226,0.3); border: 1px solid rgba(138,43,226,0.5); border-bottom-left-radius: 5px; }
        .message-time { font-size: 11px; color: #666; margin-top: 5px; }
        .quick-actions {
            display: flex; gap: 10px; padding: 10px 20px;
            background: rgba(20,20,40,0.5);
            border-left: 1px solid rgba(0,212,255,0.1); border-right: 1px solid rgba(0,212,255,0.1);
            overflow-x: auto;
        }
        .quick-btn {
            padding: 8px 16px; background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.3); border-radius: 20px;
            color: #00d4ff; font-family: 'Rajdhani', sans-serif; font-size: 14px;
            cursor: pointer; white-space: nowrap; transition: all 0.3s ease;
        }
        .quick-btn:hover { background: rgba(0,212,255,0.2); transform: scale(1.05); }
        .chat-input {
            background: rgba(20,20,40,0.9); backdrop-filter: blur(10px);
            border-radius: 0 0 20px 20px; border: 1px solid rgba(0,212,255,0.1);
            border-top: none; padding: 20px; display: flex; gap: 15px; align-items: center;
        }
        .chat-input input {
            flex: 1; padding: 15px 20px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0,212,255,0.3); border-radius: 25px;
            color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 16px; outline: none;
        }
        .chat-input input:focus { border-color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.3); }
        .chat-input input::placeholder { color: #666; }
        .send-btn, .mic-btn {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .send-btn { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; }
        .send-btn:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(0,212,255,0.5); }
        .mic-btn { background: rgba(255,0,0,0.2); border: 2px solid #ff4444; color: #ff4444; }
        .mic-btn.recording { animation: recording 1s ease-in-out infinite; background: rgba(255,0,0,0.5); }
        @keyframes recording {
            0%, 100% { box-shadow: 0 0 20px rgba(255,0,0,0.5); }
            50% { box-shadow: 0 0 40px rgba(255,0,0,0.8); }
        }
        .voice-visualizer { display: flex; align-items: center; justify-content: center; gap: 4px; height: 40px; padding: 10px; }
        .voice-bar { width: 4px; height: 20px; background: linear-gradient(180deg, #00d4ff, #8a2be2); border-radius: 2px; animation: voiceWave 0.5s ease-in-out infinite; }
        .voice-bar:nth-child(1) { animation-delay: 0.0s; } .voice-bar:nth-child(2) { animation-delay: 0.1s; }
        .voice-bar:nth-child(3) { animation-delay: 0.2s; } .voice-bar:nth-child(4) { animation-delay: 0.3s; }
        .voice-bar:nth-child(5) { animation-delay: 0.4s; }
        @keyframes voiceWave { 0%, 100% { height: 20px; } 50% { height: 40px; } }
        @media (max-width: 768px) {
            .header { padding: 10px 15px; } .logo-text { font-size: 20px; }
            .container { padding: 10px; } .message { max-width: 90%; }
            .chat-input { padding: 15px; } .chat-input input { padding: 12px 15px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="login-avatar">🤖</div>
            <h1>AIRA</h1>
            <p>Enter password to access</p>
            <input type="password" class="login-input" id="passwordInput" placeholder="Password" onkeypress="if(event.key==='Enter')login()">
            <button class="login-btn" onclick="login()">Access AIRA</button>
            <div class="login-error" id="loginError">Wrong password. Try again.</div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div class="chat-screen" id="chatScreen">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🤖</div>
                <span class="logo-text">AIRA</span>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>ONLINE</span>
            </div>
        </header>

        <div class="container">
            <div class="chat-container">
                <div class="chat-header">
                    <div class="aira-avatar">🤖</div>
                    <div class="aira-info">
                        <h2>AIRA</h2>
                        <p>Artificial Intelligence Research Assistant</p>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="message aira">
                        <div>Welcome back, Joss! I'm AIRA. How can I help you today?</div>
                        <div class="message-time">Just now</div>
                    </div>
                </div>

                <div class="quick-actions">
                    <button class="quick-btn" onclick="sendCommand('open linkedin')">💼 LinkedIn</button>
                    <button class="quick-btn" onclick="sendCommand('open github')">💻 GitHub</button>
                    <button class="quick-btn" onclick="sendCommand('open chrome')">🌐 Browser</button>
                    <button class="quick-btn" onclick="sendCommand('screenshot')">📸 Screenshot</button>
                    <button class="quick-btn" onclick="sendCommand('what can you do')">❓ Help</button>
                </div>

                <div class="chat-input">
                    <button class="mic-btn" id="micBtn" onclick="toggleRecording()">
                        <span class="material-icons">mic</span>
                    </button>
                    <input type="text" id="userInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
                    <button class="send-btn" onclick="sendMessage()">
                        <span class="material-icons">send</span>
                    </button>
                </div>

                <div class="voice-visualizer">
                    <div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div>
                    <div class="voice-bar"></div><div class="voice-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let userPassword = '';
        let isRecording = false;
        let recognition = null;

        function login() {
            const password = document.getElementById('passwordInput').value;
            if (!password) return;

            fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password })
            })
            .then(response => {
                if (response.ok) {
                    userPassword = password;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('chatScreen').style.display = 'block';
                } else {
                    document.getElementById('loginError').style.display = 'block';
                    document.getElementById('passwordInput').value = '';
                }
            })
            .catch(() => {
                document.getElementById('loginError').style.display = 'block';
            });
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';
            recognition.onresult = (event) => {
                document.getElementById('userInput').value = event.results[0][0].transcript;
                sendMessage();
            };
            recognition.onend = () => { isRecording = false; document.getElementById('micBtn').classList.remove('recording'); };
            recognition.onerror = () => { isRecording = false; document.getElementById('micBtn').classList.remove('recording'); };
        }

        function toggleRecording() {
            if (!recognition) { addMessage('aira', 'Voice not supported. Please type.'); return; }
            if (isRecording) { recognition.stop(); } else { recognition.start(); isRecording = true; document.getElementById('micBtn').classList.add('recording'); addMessage('aira', 'Listening...'); }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;
            addMessage('user', message);
            input.value = '';
            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message, password: userPassword })
            })
            .then(r => r.json())
            .then(data => { addMessage('aira', data.response); })
            .catch(() => { addMessage('aira', 'Error. Please try again.'); });
        }

        function sendCommand(command) {
            addMessage('user', command);
            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: command, password: userPassword })
            })
            .then(r => r.json())
            .then(data => {
                addMessage('aira', data.response);
                if (data.command) addMessage('aira', data.command);
            });
        }

        function addMessage(sender, text) {
            const messages = document.getElementById('chatMessages');
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = `<div>${text}</div><div class="message-time">${time}</div>`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
