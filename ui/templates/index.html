<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JENNA</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#050510">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Rajdhani',sans-serif;background:#050510;color:#fff;height:100vh;overflow:hidden;-webkit-tap-highlight-color:transparent}

        /* LOGIN */
        .login{display:flex;justify-content:center;align-items:center;height:100vh;
            background:radial-gradient(ellipse at center,#0a0a2e 0%,#050510 70%)}
        .login-box{background:rgba(15,15,35,0.95);border-radius:24px;border:1px solid rgba(0,212,255,0.15);
            padding:50px 40px;text-align:center;max-width:380px;width:90%}
        .login-box h1{font-size:36px;font-weight:700;background:linear-gradient(90deg,#00d4ff,#8a2be2);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
        .login-box .sub{color:#555;font-size:12px;letter-spacing:2px;margin-bottom:25px}
        .login-input{width:100%;padding:14px;background:rgba(0,0,0,0.5);border:1px solid rgba(0,212,255,0.2);
            border-radius:12px;color:#fff;font-size:18px;text-align:center;letter-spacing:4px;outline:none;
            font-family:'Rajdhani',sans-serif;margin-bottom:18px}
        .login-input:focus{border-color:#00d4ff;box-shadow:0 0 20px rgba(0,212,255,0.2)}
        .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#00d4ff,#8a2be2);
            border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;
            cursor:pointer;letter-spacing:2px;transition:all .3s}
        .login-btn:hover{transform:scale(1.02);box-shadow:0 0 30px rgba(0,212,255,0.4)}
        .login-err{color:#ff4444;font-size:13px;margin-top:12px;display:none}

        /* MAIN */
        .app{display:none;height:100vh;position:relative;overflow:hidden}
        canvas#orbCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}

        /* Center label */
        .center-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            text-align:center;z-index:10;pointer-events:none;transition:all .4s ease}
        .center-label.listening{top:35%}
        .center-label .state{font-size:13px;color:rgba(0,212,255,0.6);letter-spacing:3px;text-transform:uppercase;
            transition:all .3s}
        .center-label .transcript{font-size:18px;color:#fff;margin-top:10px;max-width:300px;
            opacity:0;transition:all .3s}
        .center-label.listening .transcript{opacity:1}
        .center-label .response-text{font-size:14px;color:rgba(255,255,255,0.8);margin-top:10px;
            max-width:320px;line-height:1.5;opacity:0;transition:all .3s}
        .center-label.speaking .response-text{opacity:1}

        /* Tap hint */
        .tap-hint{position:absolute;bottom:35%;left:50%;transform:translateX(-50%);z-index:10;
            font-size:12px;color:rgba(255,255,255,0.2);letter-spacing:2px;
            animation:pulseHint 3s ease-in-out infinite;pointer-events:none}
        @keyframes pulseHint{0%,100%{opacity:0.2}50%{opacity:0.4}}

        /* Chat log */
        .chat-log{position:absolute;bottom:70px;left:0;right:0;z-index:10;
            max-height:35vh;overflow-y:auto;padding:10px 16px;
            background:linear-gradient(180deg,transparent 0%,rgba(5,5,16,0.7) 30%);
            scroll-behavior:smooth}
        .chat-log::-webkit-scrollbar{width:2px}
        .chat-log::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.15);border-radius:2px}
        .log-entry{margin-bottom:8px;padding:8px 14px;border-radius:14px;font-size:13px;
            line-height:1.5;max-width:80%;animation:fadeUp .3s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .log-entry.user{margin-left:auto;background:rgba(0,212,255,0.12);border:1px solid rgba(0,212,255,0.15);color:#fff}
        .log-entry.jenna{background:rgba(138,43,226,0.1);border:1px solid rgba(138,43,226,0.15);color:rgba(255,255,255,0.9)}

        /* Input bar */
        .input-bar{position:absolute;bottom:0;left:0;right:0;z-index:11;padding:12px 16px;
            display:flex;gap:10px;align-items:center;
            background:rgba(5,5,16,0.95);border-top:1px solid rgba(0,212,255,0.06)}
        .input-bar input{flex:1;padding:12px 18px;background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.08);border-radius:24px;color:#fff;font-size:15px;
            outline:none;font-family:'Rajdhani',sans-serif}
        .input-bar input:focus{border-color:rgba(0,212,255,0.2)}
        .input-bar input::placeholder{color:#333}
        .input-bar .send{width:42px;height:42px;border-radius:50%;border:none;
            background:linear-gradient(135deg,#00d4ff,#8a2be2);color:#fff;font-size:16px;
            cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
        .input-bar .send:hover{transform:scale(1.1)}

        /* Clear button */
        .clear-btn{position:absolute;top:16px;right:16px;z-index:11;padding:5px 12px;
            background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);
            border-radius:14px;color:#444;font-size:11px;cursor:pointer;transition:all .3s}
        .clear-btn:hover{color:#ff4444;border-color:rgba(255,68,68,0.2)}

        /* Mic permission banner */
        .mic-banner{position:absolute;top:16px;left:16px;right:60px;z-index:11;padding:8px 14px;
            background:rgba(255,170,0,0.15);border:1px solid rgba(255,170,0,0.3);
            border-radius:12px;color:#ffaa00;font-size:11px;display:none;text-align:center}
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div class="login" id="loginScreen">
        <div class="login-box">
            <h1>JENNA</h1>
            <p class="sub">JOSS'S ENHANCED NEURAL NETWORK ASSISTANT</p>
            <input type="password" class="login-input" id="pwdInput" placeholder="PASSWORD" onkeypress="if(event.key==='Enter')doLogin()">
            <button class="login-btn" onclick="doLogin()">ENTER</button>
            <div class="login-err" id="loginErr">ACCESS DENIED</div>
        </div>
    </div>

    <!-- APP -->
    <div class="app" id="app">
        <canvas id="orbCanvas"></canvas>

        <div class="mic-banner" id="micBanner">🎤 Tap the orb, then allow microphone when prompted</div>
        <button class="clear-btn" onclick="clearChat()">CLEAR</button>

        <div class="center-label" id="centerLabel">
            <div class="state" id="stateLabel">READY</div>
            <div class="transcript" id="transcript"></div>
            <div class="response-text" id="responseText"></div>
        </div>

        <div class="tap-hint" id="tapHint">TAP ORB TO SPEAK</div>

        <div class="chat-log" id="chatLog"></div>

        <div class="input-bar">
            <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendText()">
            <button class="send" onclick="sendText()">➤</button>
        </div>
    </div>

    <script>
    // ===== CONFIG =====
    let PWD='', recording=false, mediaRecorder=null, audioChunks=[], speaking=false, currentAudio=null;
    let audioCtx=null, analyser=null, micStream=null;

    // ===== PARTICLE ORB =====
    const canvas=document.getElementById('orbCanvas');
    const ctx=canvas.getContext('2d');
    let W,H,cx,cy;
    const particles=[];
    const NUM=150;
    let orbRadius=100, audioLevel=0, orbState='idle';

    function resize(){
        W=canvas.width=window.innerWidth;
        H=canvas.height=window.innerHeight;
        cx=W/2; cy=H/2-40;
    }
    window.addEventListener('resize',resize);
    resize();

    class Particle{
        constructor(){this.reset()}
        reset(){
            const theta=Math.random()*Math.PI*2;
            const phi=Math.acos(2*Math.random()-1);
            const r=orbRadius*(0.6+Math.random()*0.4);
            this.baseX=r*Math.sin(phi)*Math.cos(theta);
            this.baseY=r*Math.sin(phi)*Math.sin(theta);
            this.baseZ=r*Math.cos(phi);
            this.x=this.baseX; this.y=this.baseY; this.z=this.baseZ;
            this.size=0.8+Math.random()*2;
            this.alpha=0.2+Math.random()*0.4;
            this.speed=0.002+Math.random()*0.003;
            this.angle=Math.random()*Math.PI*2;
            this.hue=220+Math.random()*60;
        }
        update(t){
            this.angle+=this.speed;
            const breathe=Math.sin(t*0.001)*6;
            const pulse=audioLevel*35;
            const r=orbRadius+breathe+pulse;
            const ox=Math.sin(this.angle)*2;
            const oy=Math.cos(this.angle*0.7)*2;
            this.x=this.baseX*(r/orbRadius)+ox;
            this.y=this.baseY*(r/orbRadius)+oy;
            this.z=this.baseZ*(r/orbRadius);
            const cosA=Math.cos(0.003), sinA=Math.sin(0.003);
            const rx=this.x*cosA-this.z*sinA;
            const rz=this.x*sinA+this.z*cosA;
            this.x=rx; this.z=rz;
            this.alpha=0.2+audioLevel*0.5;
        }
        draw(ctx){
            const scale=300/(300+this.z);
            const px=cx+this.x*scale;
            const py=cy+this.y*scale;
            const sz=this.size*scale;
            const gradient=ctx.createRadialGradient(px,py,0,px,py,sz*3);
            gradient.addColorStop(0,`hsla(${this.hue},70%,65%,${this.alpha})`);
            gradient.addColorStop(1,`hsla(${this.hue},70%,65%,0)`);
            ctx.beginPath();
            ctx.arc(px,py,sz*3,0,Math.PI*2);
            ctx.fillStyle=gradient;
            ctx.fill();
        }
    }

    for(let i=0;i<NUM;i++) particles.push(new Particle());

    function drawConnections(ctx){
        for(let i=0;i<particles.length;i++){
            for(let j=i+1;j<particles.length;j++){
                const dx=particles[i].x-particles[j].x;
                const dy=particles[i].y-particles[j].y;
                const dz=particles[i].z-particles[j].z;
                const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
                if(dist<45){
                    const alpha=(1-dist/45)*0.06*(1+audioLevel*2);
                    const s1=300/(300+particles[i].z);
                    const s2=300/(300+particles[j].z);
                    ctx.beginPath();
                    ctx.moveTo(cx+particles[i].x*s1,cy+particles[i].y*s1);
                    ctx.lineTo(cx+particles[j].x*s2,cy+particles[j].y*s2);
                    ctx.strokeStyle=`rgba(0,212,255,${alpha})`;
                    ctx.lineWidth=0.5;
                    ctx.stroke();
                }
            }
        }
    }

    function drawGlow(ctx){
        const gradient=ctx.createRadialGradient(cx,cy,0,cx,cy,orbRadius*1.8);
        const a=0.05+audioLevel*0.12;
        if(orbState==='listening'){
            gradient.addColorStop(0,`rgba(0,212,255,${a})`);
            gradient.addColorStop(0.5,`rgba(138,43,226,${a*0.4})`);
        }else if(orbState==='speaking'){
            gradient.addColorStop(0,`rgba(138,43,226,${a})`);
            gradient.addColorStop(0.5,`rgba(0,255,136,${a*0.4})`);
        }else{
            gradient.addColorStop(0,`rgba(0,212,255,${a})`);
            gradient.addColorStop(0.5,'rgba(138,43,226,0)');
        }
        gradient.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=gradient;
        ctx.fillRect(0,0,W,H);
    }

    function animate(t){
        requestAnimationFrame(animate);
        ctx.clearRect(0,0,W,H);
        if(orbState==='idle') audioLevel*=0.92;
        drawGlow(ctx);
        drawConnections(ctx);
        particles.forEach(p=>{p.update(t);p.draw(ctx)});
    }
    requestAnimationFrame(animate);

    // ===== ORB CLICK =====
    canvas.addEventListener('click',(e)=>{
        const dx=e.clientX-cx, dy=e.clientY-cy;
        if(Math.sqrt(dx*dx+dy*dy)<orbRadius*2) toggleMic();
    });

    // ===== LOGIN =====
    function doLogin(){
        const p=document.getElementById('pwdInput').value;
        if(!p)return;
        fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})})
        .then(r=>{if(r.ok){PWD=p;localStorage.setItem('jenna_pwd',p);document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';initAudio();startTimer()}
        else{document.getElementById('loginErr').style.display='block';document.getElementById('pwdInput').value=''}});
    }
    window.addEventListener('load',()=>{
        const saved=localStorage.getItem('jenna_pwd');
        if(saved){
            PWD=saved;
            fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:saved})})
            .then(r=>{if(r.ok){document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';initAudio();startTimer()}
            else{localStorage.removeItem('jenna_pwd')}});
        }
    });

    // ===== AUDIO =====
    async function initAudio(){
        try{
            audioCtx=new(window.AudioContext||window.webkitAudioContext)();
            analyser=audioCtx.createAnalyser();
            analyser.fftSize=256;
        }catch(e){}
    }

    async function toggleMic(){
        if(speaking){stopSpeaking();return}
        if(recording){
            // Stop recording
            recording=false;orbState='idle';
            if(mediaRecorder&&mediaRecorder.state==='recording') mediaRecorder.stop();
            document.getElementById('stateLabel').textContent='THINKING';
            return;
        }

        // Request mic permission
        try{
            micStream=await navigator.mediaDevices.getUserMedia({audio:true});
        }catch(e){
            document.getElementById('micBanner').style.display='block';
            setTimeout(()=>document.getElementById('micBanner').style.display='none',5000);
            return;
        }

        recording=true;orbState='listening';
        document.getElementById('stateLabel').textContent='LISTENING';
        document.getElementById('tapHint').style.display='none';
        document.getElementById('centerLabel').className='center-label listening';
        document.getElementById('transcript').textContent='';

        // Visualize mic
        if(audioCtx&&analyser){
            const src=audioCtx.createMediaStreamSource(micStream);
            src.connect(analyser);
            updateMicLevel();
        }

        // Record audio
        mediaRecorder=new MediaRecorder(micStream,{mimeType:'audio/webm'});
        audioChunks=[];
        mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data)};
        mediaRecorder.onstop=async()=>{
            if(audioChunks.length===0)return;
            const blob=new Blob(audioChunks,{type:'audio/webm'});
            const formData=new FormData();
            formData.append('audio',blob,'recording.webm');
            formData.append('password',PWD);
            document.getElementById('stateLabel').textContent='THINKING';
            try{
                const resp=await fetch('/api/listen',{method:'POST',body:formData});
                const data=await resp.json();
                if(data.text&&data.text.trim()){
                    document.getElementById('transcript').textContent=data.text;
                    addLog('user',data.text);
                    getResponse(data.text);
                }else{
                    document.getElementById('stateLabel').textContent='READY';
                    document.getElementById('tapHint').style.display='block';
                    document.getElementById('centerLabel').className='center-label';
                }
            }catch(e){
                document.getElementById('stateLabel').textContent='READY';
                document.getElementById('tapHint').style.display='block';
                document.getElementById('centerLabel').className='center-label';
            }
            if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}
        };
        mediaRecorder.start();
    }

    function updateMicLevel(){
        if(!analyser||!recording)return;
        const data=new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        let sum=0;for(let i=0;i<data.length;i++)sum+=data[i];
        audioLevel=(sum/data.length)/255;
        requestAnimationFrame(updateMicLevel);
    }

    // ===== CHAT =====
    function sendText(){
        const inp=document.getElementById('chatInput');
        const m=inp.value.trim();if(!m)return;
        inp.value='';
        addLog('user',m);
        document.getElementById('stateLabel').textContent='THINKING';
        document.getElementById('tapHint').style.display='none';
        getResponse(m);
    }

    function getResponse(msg){
        fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:msg,password:PWD})})
        .then(r=>r.json()).then(d=>{
            addLog('jenna',d.response);
            document.getElementById('responseText').textContent=d.response;
            speak(d.response);
        }).catch(()=>{
            addLog('jenna','Connection error.');
            document.getElementById('stateLabel').textContent='READY';
            document.getElementById('tapHint').style.display='block';
        });
    }

    function addLog(sender,text){
        const log=document.getElementById('chatLog');
        const time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        const d=document.createElement('div');
        d.className=`log-entry ${sender}`;
        d.innerHTML=`${text} <span style="font-size:10px;opacity:0.3;margin-left:6px">${time}</span>`;
        log.appendChild(d);
        log.scrollTop=log.scrollHeight;
    }

    // ===== TTS =====
    function speak(text){
        if(currentAudio){currentAudio.pause();currentAudio=null}
        orbState='speaking';
        document.getElementById('stateLabel').textContent='SPEAKING';
        document.getElementById('tapHint').style.display='none';
        document.getElementById('centerLabel').className='center-label speaking';
        
        fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({text:text,password:PWD})})
        .then(r=>{if(!r.ok)throw new Error();return r.blob()})
        .then(blob=>{
            const url=URL.createObjectURL(blob);
            currentAudio=new Audio(url);
            if(audioCtx){
                try{
                    const src=audioCtx.createMediaElementSource(currentAudio);
                    if(!analyser)analyser=audioCtx.createAnalyser();
                    analyser.fftSize=256;
                    src.connect(analyser);
                    analyser.connect(audioCtx.destination);
                    updateSpeakLevel();
                }catch(e){}
            }
            currentAudio.onended=()=>{stopSpeaking();URL.revokeObjectURL(url);currentAudio=null};
            currentAudio.onerror=()=>{stopSpeaking();currentAudio=null};
            currentAudio.play();
        })
        .catch(()=>{
            // Browser TTS fallback
            if(window.speechSynthesis){
                const u=new SpeechSynthesisUtterance(text);u.rate=1.05;u.pitch=1.15;
                u.onend=()=>stopSpeaking();
                window.speechSynthesis.speak(u);
            }else{stopSpeaking()}
        });
    }

    function updateSpeakLevel(){
        if(!analyser||orbState!=='speaking')return;
        const data=new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        let sum=0;for(let i=0;i<data.length;i++)sum+=data[i];
        audioLevel=(sum/data.length)/255;
        requestAnimationFrame(updateSpeakLevel);
    }

    function stopSpeaking(){
        if(currentAudio){currentAudio.pause();currentAudio=null}
        if(window.speechSynthesis)window.speechSynthesis.cancel();
        orbState='idle';audioLevel=0;
        document.getElementById('stateLabel').textContent='READY';
        document.getElementById('tapHint').style.display='block';
        document.getElementById('centerLabel').className='center-label';
    }

    function clearChat(){
        document.getElementById('chatLog').innerHTML='';
        addLog('jenna','Fresh start! Tap the orb or type a message.');
        fetch('/api/clear-memory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:PWD})});
    }

    // ===== TIMER =====
    function startTimer(){
        const start=Date.now();
        setInterval(()=>{
            const e=Math.floor((Date.now()-start)/1000);
            // Timer hidden - no ugly numbers on screen
        },1000);
    }
    </script>
</body>
</html>
