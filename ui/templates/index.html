<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JENNA</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#050510">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#050510;color:#fff;height:100vh;height:100dvh;overflow:hidden}

        /* LOGIN */
        .login{display:flex;justify-content:center;align-items:center;height:100vh;background:radial-gradient(ellipse at center,#0a0a2e,#050510 70%)}
        .login-box{background:rgba(15,15,35,0.95);border-radius:24px;border:1px solid rgba(0,212,255,0.15);padding:50px 40px;text-align:center;max-width:380px;width:90%}
        .login-box h1{font-size:36px;font-weight:700;background:linear-gradient(90deg,#00d4ff,#8a2be2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
        .login-box .sub{color:#555;font-size:11px;letter-spacing:2px;margin-bottom:25px}
        .login-input{width:100%;padding:14px;background:rgba(0,0,0,0.5);border:1px solid rgba(0,212,255,0.2);border-radius:12px;color:#fff;font-size:18px;text-align:center;letter-spacing:4px;outline:none;margin-bottom:18px}
        .login-input:focus{border-color:#00d4ff}
        .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#00d4ff,#8a2be2);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:2px}
        .login-err{color:#ff4444;font-size:13px;margin-top:12px;display:none}

        /* MAIN APP */
        .app{display:none;height:100vh;height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#0a0a2e 0%,#050510 70%)}

        /* STARFIELD */
        .starfield{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
        .star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--dur) var(--del) infinite alternate}
        @keyframes twinkle{0%{opacity:0.15}100%{opacity:0.8}}

        /* ROBOT AVATAR */
        .avatar-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);z-index:5;transition:all .5s ease}
        .avatar-wrap.listening{top:42%}
        .avatar-wrap.speaking{top:42%}
        .avatar-container{animation:float 4s ease-in-out infinite;transition:filter .5s}
        .avatar-container.speaking{animation:bounce 0.5s ease-in-out infinite}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
        .avatar-container.idle{filter:drop-shadow(0 0 30px rgba(34,211,238,0.3))}
        .avatar-container.listening{filter:drop-shadow(0 0 40px rgba(34,211,238,0.5))}
        .avatar-container.thinking{filter:drop-shadow(0 0 40px rgba(167,139,250,0.5))}
        .avatar-container.speaking{filter:drop-shadow(0 0 40px rgba(52,211,153,0.5))}

        /* Robot SVG */
        .robot-svg{width:180px;height:260px}
        .eye-glow{filter:drop-shadow(0 0 8px #00e5cc)}
        .body-glow{filter:drop-shadow(0 0 20px rgba(0,229,204,0.2))}

        /* Status text */
        .status-text{position:absolute;top:50%;left:50%;transform:translate(-50%,100px);z-index:10;text-align:center;pointer-events:none}
        .status-text.listening{transform:translate(-50%,70px)}
        .status-text .state{font-size:11px;color:rgba(0,229,204,0.5);letter-spacing:3px;text-transform:uppercase}
        .status-text .transcript{font-size:15px;color:#fff;margin-top:8px;max-width:280px;min-height:20px}
        .status-text .response-text{font-size:13px;color:rgba(255,255,255,0.8);margin-top:6px;max-width:300px;line-height:1.5;opacity:0;transition:all .3s}
        .status-text.speaking .response-text{opacity:1}

        /* Tap hint */
        .tap-hint{position:absolute;bottom:30%;left:50%;transform:translateX(-50%);z-index:10;font-size:11px;color:rgba(255,255,255,0.15);letter-spacing:2px;animation:pulse 3s ease-in-out infinite;pointer-events:none}
        @keyframes pulse{0%,100%{opacity:0.15}50%{opacity:0.35}}

        /* STOP button */
        .stop-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,50px);z-index:12;width:70px;height:70px;border-radius:50%;border:2px solid rgba(255,60,60,0.5);background:rgba(255,40,40,0.2);color:#ff4444;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;display:none;transition:all .3s}
        .stop-btn:active{transform:translate(-50%,50px) scale(0.9)}
        .countdown{position:absolute;top:50%;left:50%;transform:translate(-50%,120px);z-index:12;font-size:10px;color:rgba(255,255,255,0.25);letter-spacing:2px;display:none}

        /* Chat log */
        .chat-log{position:absolute;bottom:65px;left:0;right:0;z-index:10;max-height:30vh;overflow-y:auto;padding:10px 16px;background:linear-gradient(180deg,transparent,rgba(5,5,16,0.8) 30%)}
        .chat-log::-webkit-scrollbar{width:2px}
        .chat-log::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.15);border-radius:2px}
        .log-entry{margin-bottom:6px;padding:7px 12px;border-radius:12px;font-size:12px;line-height:1.4;max-width:80%;animation:fadeUp .3s}
        @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
        .log-entry.user{margin-left:auto;background:rgba(0,229,204,0.1);border:1px solid rgba(0,229,204,0.12)}
        .log-entry.jenna{background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.1)}

        /* Input bar */
        .input-bar{position:absolute;bottom:0;left:0;right:0;z-index:11;padding:10px 14px;display:flex;gap:8px;align-items:center;background:rgba(5,5,16,0.95);border-top:1px solid rgba(0,212,255,0.05)}
        .input-bar input{flex:1;padding:11px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:22px;color:#fff;font-size:14px;outline:none}
        .input-bar input::placeholder{color:#333}
        .input-bar .send{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,#00e5cc,#9b6dff);color:#fff;font-size:15px;cursor:pointer;flex-shrink:0}

        /* Clear button */
        .clear-btn{position:absolute;top:14px;right:14px;z-index:11;padding:4px 10px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;color:#444;font-size:10px;cursor:pointer}

        /* Install banner */
        .install-banner{position:absolute;top:14px;left:14px;z-index:11;padding:6px 12px;background:rgba(0,229,204,0.1);border:1px solid rgba(0,229,204,0.2);border-radius:12px;color:#00e5cc;font-size:10px;cursor:pointer;display:none}
    </style>
</head>
<body>
    <div class="login" id="loginScreen">
        <div class="login-box">
            <h1>JENNA</h1>
            <p class="sub">JOSS'S ENHANCED NEURAL NETWORK ASSISTANT</p>
            <input type="password" class="login-input" id="pwdInput" placeholder="PASSWORD" onkeypress="if(event.key==='Enter')doLogin()">
            <button class="login-btn" onclick="doLogin()">ENTER</button>
            <div class="login-err" id="loginErr">ACCESS DENIED</div>
        </div>
    </div>

    <div class="app" id="app">
        <!-- Starfield -->
        <div class="starfield" id="starfield"></div>

        <!-- Robot Avatar -->
        <div class="avatar-wrap" id="avatarWrap">
            <div class="avatar-container idle" id="avatarContainer">
                <svg class="robot-svg" viewBox="0 0 180 260" fill="none">
                    <!-- Body -->
                    <ellipse cx="90" cy="185" rx="52" ry="62" fill="url(#bodyGrad)" class="body-glow"/>
                    <!-- Light reflection -->
                    <ellipse cx="72" cy="158" rx="14" ry="22" fill="white" opacity="0.18" transform="rotate(-15 72 158)"/>
                    <!-- Arms -->
                    <ellipse cx="32" cy="178" rx="12" ry="36" fill="url(#armGrad)" transform="rotate(-8 32 178)"/>
                    <ellipse cx="148" cy="178" rx="12" ry="36" fill="url(#armGrad)" transform="rotate(8 148 178)"/>
                    <!-- Hands -->
                    <ellipse cx="28" cy="210" rx="10" ry="10" fill="url(#armGrad)"/>
                    <ellipse cx="152" cy="210" rx="10" ry="10" fill="url(#armGrad)"/>
                    <!-- Chest core -->
                    <circle cx="90" cy="183" r="18" fill="#ffffff" opacity="0.9">
                        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="90" cy="183" r="12" fill="#00e5cc" opacity="0.8">
                        <animate attributeName="r" values="11;13;11" dur="2.5s" repeatCount="indefinite"/>
                    </circle>
                    <!-- Neck -->
                    <rect x="82" y="112" width="16" height="18" rx="4" fill="#e8f0f7"/>
                    <!-- Head -->
                    <ellipse cx="90" cy="80" rx="48" ry="42" fill="url(#headGrad)"/>
                    <!-- Face plate -->
                    <ellipse cx="90" cy="82" rx="40" ry="34" fill="#0a0a1a" opacity="0.6"/>
                    <!-- Eyes -->
                    <g id="eyes" class="eye-glow">
                        <ellipse cx="72" cy="80" rx="8" ry="10" fill="#00e5cc" opacity="0.9">
                            <animate attributeName="ry" values="10;1;10" dur="0.15s" begin="4.2s" repeatCount="indefinite" repeatDur="0.3s"/>
                        </ellipse>
                        <ellipse cx="108" cy="80" rx="8" ry="10" fill="#00e5cc" opacity="0.9">
                            <animate attributeName="ry" values="10;1;10" dur="0.15s" begin="4.2s" repeatCount="indefinite" repeatDur="0.3s"/>
                        </ellipse>
                        <!-- Eye shine -->
                        <circle cx="69" cy="76" r="2" fill="white" opacity="0.7"/>
                        <circle cx="105" cy="76" r="2" fill="white" opacity="0.7"/>
                    </g>
                    <!-- Mouth -->
                    <path id="mouth" d="M78 95 Q90 100 102 95" stroke="#00e5cc" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
                    <!-- Antenna -->
                    <line x1="90" y1="38" x2="90" y2="28" stroke="#00e5cc" stroke-width="2" opacity="0.4"/>
                    <circle cx="90" cy="26" r="4" fill="#00e5cc" opacity="0.5">
                        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <!-- Gradients -->
                    <defs>
                        <linearGradient id="bodyGrad" x1="90" y1="123" x2="90" y2="247">
                            <stop offset="0%" stop-color="#e8f0f7"/>
                            <stop offset="100%" stop-color="#c0cdd8"/>
                        </linearGradient>
                        <linearGradient id="armGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#dde5ed"/>
                            <stop offset="100%" stop-color="#b0bcc8"/>
                        </linearGradient>
                        <radialGradient id="headGrad">
                            <stop offset="0%" stop-color="#f0f4f8"/>
                            <stop offset="100%" stop-color="#d0d8e0"/>
                        </radialGradient>
                    </defs>
                </svg>
            </div>
        </div>

        <!-- Status -->
        <div class="status-text" id="statusText">
            <div class="state" id="stateLabel">READY</div>
            <div class="transcript" id="transcript"></div>
            <div class="response-text" id="responseText"></div>
        </div>
        <div class="tap-hint" id="tapHint">TAP CHEST MIC TO TALK</div>

        <!-- Controls -->
        <button class="clear-btn" onclick="clearChat()">CLEAR</button>
        <button class="stop-btn" id="stopBtn" onclick="stopListening()">STOP</button>
        <div class="countdown" id="countdown"></div>

        <!-- Chat -->
        <div class="chat-log" id="chatLog"></div>
        <div class="input-bar">
            <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendText()">
            <button class="send" onclick="sendText()">➤</button>
        </div>
    </div>

    <script>
    let PWD='',recording=false,speaking=false,currentAudio=null;
    let audioCtx=null,analyser=null,micStream=null,speechRec=null,listenTimer=null;

    // ===== STARFIELD =====
    (function(){
        const sf=document.getElementById('starfield');
        for(let i=0;i<60;i++){
            const s=document.createElement('div');
            s.className='star';
            s.style.cssText=`top:${Math.random()*100}%;left:${Math.random()*100}%;width:${0.5+Math.random()*2}px;height:${0.5+Math.random()*2}px;--dur:${2+Math.random()*3}s;--del:${Math.random()*4}s`;
            sf.appendChild(s);
        }
    })();

    // ===== LOGIN =====
    function doLogin(){
        const p=document.getElementById('pwdInput').value;if(!p)return;
        fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})})
        .then(r=>{if(r.ok){PWD=p;localStorage.setItem('jenna_pwd',p);document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';initAudio()}
        else{document.getElementById('loginErr').style.display='block';document.getElementById('pwdInput').value=''}});
    }
    window.addEventListener('load',()=>{
        const s=localStorage.getItem('jenna_pwd');
        if(s){PWD=s;fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:s})})
        .then(r=>{if(r.ok){document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';initAudio()}else localStorage.removeItem('jenna_pwd')})}
    });

    // ===== MIC =====
    function initAudio(){
        try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=256}catch(e){}
        const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        if(!SR){addLog('jenna','🎤 Voice not supported here. Use text input.');return}
        speechRec=new SR();
        speechRec.continuous=false;speechRec.interimResults=true;speechRec.lang='en-US';
        speechRec.onresult=e=>{
            let final='',interim='';
            for(let i=e.resultIndex;i<e.results.length;i++){
                const t=e.results[i][0].transcript;
                if(e.results[i].isFinal)final+=t;else interim=t;
            }
            if(interim)document.getElementById('transcript').textContent=interim;
            if(final)document.getElementById('transcript').textContent=final;
        };
        speechRec.onend=()=>{
            clearTimeout(listenTimer);cdInterval&&clearInterval(cdInterval);
            const was=recording;recording=false;
            document.getElementById('stopBtn').style.display='none';
            document.getElementById('countdown').style.display='none';
            setAvatarState('idle');
            if(was){
                const text=document.getElementById('transcript').textContent.trim();
                if(text&&text!=='Speak now...'){
                    addLog('user',text);document.getElementById('transcript').textContent='';
                    document.getElementById('stateLabel').textContent='THINKING';getResponse(text);
                }else{
                    addLog('jenna','I didn\'t catch that. Try again or type below.');
                    document.getElementById('stateLabel').textContent='READY';
                    document.getElementById('tapHint').style.display='block';
                }
            }
            if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}
        };
        speechRec.onerror=e=>{
            clearTimeout(listenTimer);cdInterval&&clearInterval(cdInterval);
            recording=false;
            document.getElementById('stopBtn').style.display='none';
            document.getElementById('countdown').style.display='none';
            setAvatarState('idle');
            if(e.error==='not-allowed'||e.error==='service-not-allowed'){
                addLog('jenna','🎤 Mic blocked. Allow mic in browser settings.');
            }else if(e.error!=='no-speech'){
                addLog('jenna','Could not hear. Try again or type below.');
            }
            document.getElementById('stateLabel').textContent='READY';
            document.getElementById('tapHint').style.display='block';
            if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}
        };
    }

    // Click chest mic or anywhere to talk
    function toggleMic(){
        if(speaking){stopSpeaking();return}
        if(recording){stopListening();return}
        if(!speechRec){addLog('jenna','🎤 Voice not supported. Type below.');return}
        startListening();
    }

    // Make the robot avatar clickable
    document.getElementById('avatarContainer').addEventListener('click',toggleMic);

    async function startListening(){
        try{micStream=await navigator.mediaDevices.getUserMedia({audio:true})}
        catch(e){addLog('jenna','🎤 Mic permission denied. Allow mic or type below.');return}

        recording=true;setAvatarState('listening');
        document.getElementById('stateLabel').textContent='LISTENING';
        document.getElementById('tapHint').style.display='none';
        document.getElementById('stopBtn').style.display='block';
        document.getElementById('transcript').textContent='Speak now...';

        let remaining=10;
        const cdEl=document.getElementById('countdown');
        cdEl.style.display='block';cdEl.textContent=`Auto-stop in ${remaining}s`;
        cdInterval=setInterval(()=>{remaining--;cdEl.textContent=remaining>0?`Auto-stop in ${remaining}s`:'Processing...';if(remaining<=0)clearInterval(cdInterval)},1000);

        listenTimer=setTimeout(()=>{
            clearInterval(cdInterval);cdEl.style.display='none';
            if(recording){
                const text=document.getElementById('transcript').textContent.trim();
                stopListening();
                if(text&&text!=='Speak now...'){addLog('user',text);document.getElementById('transcript').textContent='';getResponse(text)}
                else{addLog('jenna','⏰ Didn\'t hear anything. Tap mic or type below.');document.getElementById('stateLabel').textContent='READY';document.getElementById('tapHint').style.display='block'}
            }
        },10000);

        try{speechRec.start()}catch(e){recording=false;setAvatarState('idle');document.getElementById('stopBtn').style.display='none';document.getElementById('tapHint').style.display='block'}
    }

    let cdInterval;
    function stopListening(){recording=false;clearTimeout(listenTimer);cdInterval&&clearInterval(cdInterval);document.getElementById('countdown').style.display='none';try{speechRec.stop()}catch(e){}}

    // ===== AVATAR STATE =====
    function setAvatarState(state){
        const c=document.getElementById('avatarContainer');
        const w=document.getElementById('avatarWrap');
        const s=document.getElementById('statusText');
        c.className='avatar-container '+state;
        w.className='avatar-wrap '+(state==='listening'||state==='speaking'?state:'');
        s.className='status-text '+(state==='speaking'?'speaking':'');
        document.getElementById('stateLabel').textContent=state.toUpperCase();
        // Change eye color based on state
        const eyes=document.querySelectorAll('#eyes ellipse');
        const colors={idle:'#00e5cc',listening:'#00e5cc',thinking:'#a78bfa',speaking:'#34d399'};
        eyes.forEach(e=>{if(e.getAttribute('rx'))e.setAttribute('fill',colors[state]||'#00e5cc')});
    }

    // ===== CHAT =====
    function sendText(){
        const inp=document.getElementById('chatInput');const m=inp.value.trim();if(!m)return;inp.value='';
        addLog('user',m);setAvatarState('thinking');document.getElementById('tapHint').style.display='none';getResponse(m);
    }
    function getResponse(msg){
        fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,password:PWD})})
        .then(r=>r.json()).then(d=>{
            addLog('jenna',d.response);
            document.getElementById('responseText').textContent=d.response;
            speak(d.response);
        }).catch(()=>{addLog('jenna','Connection error.');setAvatarState('idle');document.getElementById('tapHint').style.display='block'});
    }
    function addLog(s,t){
        const log=document.getElementById('chatLog'),time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        const d=document.createElement('div');d.className='log-entry '+s;
        d.innerHTML=t+' <span style="font-size:9px;opacity:0.3;margin-left:6px">'+time+'</span>';
        log.appendChild(d);log.scrollTop=log.scrollHeight;
    }

    // ===== TTS =====
    function speak(text){
        if(currentAudio){currentAudio.pause();currentAudio=null}
        setAvatarState('speaking');document.getElementById('tapHint').style.display='none';
        fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,password:PWD})})
        .then(r=>{if(!r.ok)throw Error();return r.blob()})
        .then(blob=>{const url=URL.createObjectURL(blob);currentAudio=new Audio(url);
            currentAudio.onend=()=>{stopSpeaking();URL.revokeObjectURL(url);currentAudio=null};
            currentAudio.onerror=()=>{stopSpeaking();currentAudio=null;browserTTS(text)};
            currentAudio.play();})
        .catch(()=>browserTTS(text));
    }
    function browserTTS(text){
        if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(text);u.rate=1.05;u.pitch=1.15;u.onend=()=>stopSpeaking();window.speechSynthesis.speak(u)}else stopSpeaking();
    }
    function stopSpeaking(){
        if(currentAudio){currentAudio.pause();currentAudio=null}
        if(window.speechSynthesis)window.speechSynthesis.cancel();
        setAvatarState('idle');document.getElementById('tapHint').style.display='block';
    }
    function clearChat(){
        document.getElementById('chatLog').innerHTML='';addLog('jenna','Fresh start! Tap the robot or type below.');
        fetch('/api/clear-memory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:PWD})});
    }

    // ===== PWA INSTALL =====
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBanner').style.display='block'});
    function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>deferredPrompt=null)}}
    </script>
</body>
</html>
