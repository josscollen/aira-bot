<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIRA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Rajdhani',sans-serif;background:#050510;color:#fff;height:100vh;overflow:hidden;-webkit-tap-highlight-color:transparent}

        /* LOGIN */
        .login{display:flex;justify-content:center;align-items:center;height:100vh;
            background:radial-gradient(ellipse at center,#0a0a2e 0%,#050510 70%)}
        .login-box{background:rgba(15,15,35,0.95);border-radius:24px;border:1px solid rgba(0,212,255,0.15);
            padding:50px 40px;text-align:center;max-width:380px;width:90%}
        .login-box h1{font-size:36px;font-weight:700;background:linear-gradient(90deg,#00d4ff,#8a2be2);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
        .login-box .sub{color:#555;font-size:12px;letter-spacing:2px;margin-bottom:25px}
        .login-input{width:100%;padding:14px;background:rgba(0,0,0,0.5);border:1px solid rgba(0,212,255,0.2);
            border-radius:12px;color:#fff;font-size:18px;text-align:center;letter-spacing:4px;outline:none;
            font-family:'Rajdhani',sans-serif;margin-bottom:18px}
        .login-input:focus{border-color:#00d4ff;box-shadow:0 0 20px rgba(0,212,255,0.2)}
        .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#00d4ff,#8a2be2);
            border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;
            cursor:pointer;letter-spacing:2px;transition:all .3s}
        .login-btn:hover{transform:scale(1.02);box-shadow:0 0 30px rgba(0,212,255,0.4)}
        .login-err{color:#ff4444;font-size:13px;margin-top:12px;display:none}

        /* MAIN */
        .app{display:none;height:100vh;position:relative;overflow:hidden}
        canvas#orbCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}

        /* Status bar */
        .status-bar{position:absolute;top:0;left:0;right:0;z-index:10;padding:16px 20px;
            display:flex;justify-content:space-between;align-items:center;
            background:linear-gradient(180deg,rgba(5,5,16,0.9) 0%,transparent 100%)}
        .status-pill{display:flex;align-items:center;gap:6px;padding:6px 14px;
            background:rgba(0,0,0,0.4);border:1px solid rgba(0,212,255,0.15);
            border-radius:20px;font-size:12px;color:#888}
        .status-pill .dot{width:6px;height:6px;border-radius:50%;background:#00ff88;
            box-shadow:0 0 6px #00ff88}
        .status-pill.right{color:#00d4ff;border-color:rgba(0,212,255,0.2)}

        /* Center label */
        .center-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            text-align:center;z-index:10;pointer-events:none;transition:all .4s ease}
        .center-label.listening{top:38%}
        .center-label .state{font-size:14px;color:#00d4ff;letter-spacing:3px;text-transform:uppercase;
            opacity:0.7;transition:all .3s}
        .center-label .transcript{font-size:20px;color:#fff;margin-top:8px;max-width:300px;
            opacity:0;transition:all .3s}
        .center-label.listening .transcript{opacity:1}
        .center-label .response-text{font-size:15px;color:rgba(255,255,255,0.8);margin-top:10px;
            max-width:320px;line-height:1.5;opacity:0;transition:all .3s}
        .center-label.speaking .response-text{opacity:1}

        /* Tap hint */
        .tap-hint{position:absolute;bottom:30%;left:50%;transform:translateX(-50%);z-index:10;
            font-size:13px;color:rgba(255,255,255,0.25);letter-spacing:2px;
            animation:pulseHint 3s ease-in-out infinite;pointer-events:none}
        @keyframes pulseHint{0%,100%{opacity:0.25}50%{opacity:0.5}}

        /* Chat log */
        .chat-log{position:absolute;bottom:0;left:0;right:0;z-index:10;
            max-height:40vh;overflow-y:auto;padding:10px 16px 80px;
            background:linear-gradient(180deg,transparent 0%,rgba(5,5,16,0.85) 30%,rgba(5,5,16,0.95) 100%);
            scroll-behavior:smooth}
        .chat-log::-webkit-scrollbar{width:3px}
        .chat-log::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.2);border-radius:2px}
        .log-entry{margin-bottom:8px;padding:8px 14px;border-radius:14px;font-size:13px;
            line-height:1.5;max-width:85%;animation:fadeUp .3s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .log-entry.user{align-self:flex-end;margin-left:auto;background:rgba(0,212,255,0.15);
            border:1px solid rgba(0,212,255,0.2);color:#fff}
        .log-entry.aira{background:rgba(138,43,226,0.12);border:1px solid rgba(138,43,226,0.2);
            color:rgba(255,255,255,0.9)}

        /* Text input */
        .input-bar{position:absolute;bottom:0;left:0;right:0;z-index:11;padding:12px 16px;
            display:flex;gap:10px;align-items:center;
            background:rgba(5,5,16,0.95);border-top:1px solid rgba(0,212,255,0.08)}
        .input-bar input{flex:1;padding:12px 18px;background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.1);border-radius:24px;color:#fff;font-size:15px;
            outline:none;font-family:'Rajdhani',sans-serif}
        .input-bar input:focus{border-color:rgba(0,212,255,0.3)}
        .input-bar input::placeholder{color:#444}
        .input-bar .send{width:42px;height:42px;border-radius:50%;border:none;
            background:linear-gradient(135deg,#00d4ff,#8a2be2);color:#fff;font-size:18px;
            cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
        .input-bar .send:hover{transform:scale(1.1)}

        /* Clear button */
        .clear-btn{position:absolute;top:16px;right:16px;z-index:11;padding:6px 12px;
            background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
            border-radius:16px;color:#666;font-size:11px;cursor:pointer;transition:all .3s}
        .clear-btn:hover{color:#ff4444;border-color:rgba(255,68,68,0.3)}
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div class="login" id="loginScreen">
        <div class="login-box">
            <h1>AIRA</h1>
            <p class="sub">ARTIFICIAL INTELLIGENCE RESEARCH ASSISTANT</p>
            <input type="password" class="login-input" id="pwdInput" placeholder="PASSWORD" onkeypress="if(event.key==='Enter')doLogin()">
            <button class="login-btn" onclick="doLogin()">ENTER</button>
            <div class="login-err" id="loginErr">ACCESS DENIED</div>
        </div>
    </div>

    <!-- APP -->
    <div class="app" id="app">
        <canvas id="orbCanvas"></canvas>

        <div class="status-bar">
            <div class="status-pill"><div class="dot"></div>ONLINE</div>
            <div class="status-pill right" id="timer">00:00</div>
        </div>

        <div class="center-label" id="centerLabel">
            <div class="state" id="stateLabel">READY</div>
            <div class="transcript" id="transcript"></div>
            <div class="response-text" id="responseText"></div>
        </div>

        <div class="tap-hint" id="tapHint">TAP ORB TO SPEAK</div>

        <div class="chat-log" id="chatLog"></div>

        <button class="clear-btn" onclick="clearChat()">CLEAR</button>

        <div class="input-bar">
            <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendText()">
            <button class="send" onclick="sendText()">➤</button>
        </div>
    </div>

    <script>
    // ===== CONFIG =====
    let PWD='', recording=false, rec=null, speaking=false, currentAudio=null;
    let audioCtx=null, analyser=null, micStream=null;
    const synth=window.speechSynthesis;

    // ===== PARTICLE ORB =====
    const canvas=document.getElementById('orbCanvas');
    const ctx=canvas.getContext('2d');
    let W,H,cx,cy;
    const particles=[];
    const NUM=180;
    let orbRadius=120, targetRadius=120;
    let audioLevel=0, idleTime=0, orbState='idle'; // idle, listening, speaking

    function resize(){
        W=canvas.width=window.innerWidth;
        H=canvas.height=window.innerHeight;
        cx=W/2; cy=H/2 - 30;
    }
    window.addEventListener('resize',resize);
    resize();

    class Particle{
        constructor(){this.reset()}
        reset(){
            const theta=Math.random()*Math.PI*2;
            const phi=Math.acos(2*Math.random()-1);
            const r=orbRadius*(0.7+Math.random()*0.3);
            this.baseX=r*Math.sin(phi)*Math.cos(theta);
            this.baseY=r*Math.sin(phi)*Math.sin(theta);
            this.baseZ=r*Math.cos(phi);
            this.x=this.baseX; this.y=this.baseY; this.z=this.baseZ;
            this.size=0.8+Math.random()*2;
            this.alpha=0.3+Math.random()*0.5;
            this.speed=0.002+Math.random()*0.004;
            this.angle=Math.random()*Math.PI*2;
            this.hue=220+Math.random()*60; // blue-purple range
        }
        update(t){
            this.angle+=this.speed;
            const breathe=Math.sin(t*0.001)*8;
            const pulse=audioLevel*40;
            const r=orbRadius+breathe+pulse;
            
            // Gentle orbit
            const ox=Math.sin(this.angle)*3;
            const oy=Math.cos(this.angle*0.7)*3;
            
            this.x=this.baseX*(r/orbRadius)+ox;
            this.y=this.baseY*(r/orbRadius)+oy;
            this.z=this.baseZ*(r/orbRadius);
            
            // Slow rotation
            const cosA=Math.cos(0.003), sinA=Math.sin(0.003);
            const rx=this.x*cosA-this.z*sinA;
            const rz=this.x*sinA+this.z*cosA;
            this.x=rx; this.z=rz;
            
            // Scale alpha based on audio
            this.alpha=0.3+audioLevel*0.5;
        }
        draw(ctx){
            // Project 3D to 2D
            const scale=300/(300+this.z);
            const px=cx+this.x*scale;
            const py=cy+this.y*scale;
            const sz=this.size*scale;
            
            const gradient=ctx.createRadialGradient(px,py,0,px,py,sz*3);
            gradient.addColorStop(0,`hsla(${this.hue},80%,70%,${this.alpha})`);
            gradient.addColorStop(1,`hsla(${this.hue},80%,70%,0)`);
            
            ctx.beginPath();
            ctx.arc(px,py,sz*3,0,Math.PI*2);
            ctx.fillStyle=gradient;
            ctx.fill();
        }
    }

    for(let i=0;i<NUM;i++) particles.push(new Particle());

    function drawConnections(ctx){
        for(let i=0;i<particles.length;i++){
            for(let j=i+1;j<particles.length;j++){
                const dx=particles[i].x-particles[j].x;
                const dy=particles[i].y-particles[j].y;
                const dz=particles[i].z-particles[j].z;
                const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
                if(dist<50){
                    const alpha=(1-dist/50)*0.08*(1+audioLevel*2);
                    const scale1=300/(300+particles[i].z);
                    const scale2=300/(300+particles[j].z);
                    ctx.beginPath();
                    ctx.moveTo(cx+particles[i].x*scale1,cy+particles[i].y*scale1);
                    ctx.lineTo(cx+particles[j].x*scale2,cy+particles[j].y*scale2);
                    ctx.strokeStyle=`rgba(0,212,255,${alpha})`;
                    ctx.lineWidth=0.5;
                    ctx.stroke();
                }
            }
        }
    }

    function drawGlow(ctx){
        const gradient=ctx.createRadialGradient(cx,cy,0,cx,cy,orbRadius*2);
        const glowAlpha=0.06+audioLevel*0.15;
        if(orbState==='listening'){
            gradient.addColorStop(0,`rgba(0,212,255,${glowAlpha})`);
            gradient.addColorStop(0.5,`rgba(138,43,226,${glowAlpha*0.5})`);
        }else if(orbState==='speaking'){
            gradient.addColorStop(0,`rgba(138,43,226,${glowAlpha})`);
            gradient.addColorStop(0.5,`rgba(0,255,136,${glowAlpha*0.5})`);
        }else{
            gradient.addColorStop(0,`rgba(0,212,255,${glowAlpha})`);
            gradient.addColorStop(0.5,'rgba(138,43,226,0)');
        }
        gradient.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=gradient;
        ctx.fillRect(0,0,W,H);
    }

    function animate(t){
        requestAnimationFrame(animate);
        ctx.clearRect(0,0,W,H);
        
        // Smooth audio level decay
        if(orbState==='idle') audioLevel*=0.92;
        
        drawGlow(ctx);
        drawConnections(ctx);
        particles.forEach(p=>{p.update(t);p.draw(ctx)});
    }
    requestAnimationFrame(animate);

    // ===== ORB CLICK TO TALK =====
    canvas.addEventListener('click',(e)=>{
        const dx=e.clientX-cx, dy=e.clientY-cy;
        if(Math.sqrt(dx*dx+dy*dy)<orbRadius*2){
            toggleMic();
        }
    });

    // ===== LOGIN =====
    function doLogin(){
        const p=document.getElementById('pwdInput').value;
        if(!p)return;
        fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})})
        .then(r=>{if(r.ok){PWD=p;document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';initAudio();startTimer()}
        else{document.getElementById('loginErr').style.display='block';document.getElementById('pwdInput').value=''}});
    }

    // ===== AUDIO / MIC =====
    async function initAudio(){
        try{
            audioCtx=new(window.AudioContext||window.webkitAudioContext)();
            analyser=audioCtx.createAnalyser();
            analyser.fftSize=256;
        }catch(e){console.log('Audio init failed')}
        
        if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
            const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
            rec=new SR();rec.continuous=false;rec.interimResults=true;rec.lang='en-US';
            rec.onresult=e=>{
                let interim='';
                for(let i=e.resultIndex;i<e.results.length;i++){
                    const t=e.results[i][0].transcript;
                    if(e.results[i].isFinal) document.getElementById('transcript').textContent=t;
                    else interim=t;
                }
                if(interim) document.getElementById('transcript').textContent=interim;
            };
            rec.onend=()=>{stopListening()};
            rec.onerror=()=>{stopListening()};
        }
    }

    async function startMicStream(){
        try{
            micStream=await navigator.mediaDevices.getUserMedia({audio:true});
            if(audioCtx&&analyser){
                const src=audioCtx.createMediaStreamSource(micStream);
                src.connect(analyser);
                updateMicLevel();
            }
        }catch(e){console.log('Mic stream failed')}
    }

    function stopMicStream(){
        if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}
    }

    function updateMicLevel(){
        if(!analyser||!recording)return;
        const data=new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        let sum=0;for(let i=0;i<data.length;i++)sum+=data[i];
        audioLevel=(sum/data.length)/255;
        requestAnimationFrame(updateMicLevel);
    }

    function toggleMic(){
        if(speaking){stopSpeaking();return}
        if(recording){rec.stop();return}
        if(!rec){addLog('aira','Voice not supported. Type your message.');return}
        
        recording=true;orbState='listening';
        document.getElementById('stateLabel').textContent='LISTENING';
        document.getElementById('tapHint').style.display='none';
        document.getElementById('centerLabel').className='center-label listening';
        document.getElementById('transcript').textContent='';
        startMicStream();
        rec.start();
    }

    function stopListening(){
        recording=false;orbState='idle';
        audioLevel=0;
        stopMicStream();
        document.getElementById('stateLabel').textContent='THINKING';
        document.getElementById('centerLabel').className='center-label';
        
        const text=document.getElementById('transcript').textContent.trim();
        if(text){
            addLog('user',text);
            document.getElementById('transcript').textContent='';
            getResponse(text);
        }else{
            document.getElementById('stateLabel').textContent='READY';
            document.getElementById('tapHint').style.display='block';
        }
    }

    // ===== CHAT =====
    function sendText(){
        const inp=document.getElementById('chatInput');
        const m=inp.value.trim();if(!m)return;
        inp.value='';
        addLog('user',m);
        document.getElementById('stateLabel').textContent='THINKING';
        document.getElementById('tapHint').style.display='none';
        getResponse(m);
    }

    function getResponse(msg){
        fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:msg,password:PWD})})
        .then(r=>r.json()).then(d=>{
            addLog('aira',d.response);
            document.getElementById('responseText').textContent=d.response;
            document.getElementById('stateLabel').textContent='SPEAKING';
            speak(d.response);
        }).catch(()=>{
            addLog('aira','Connection error.');
            document.getElementById('stateLabel').textContent='READY';
            document.getElementById('tapHint').style.display='block';
        });
    }

    function addLog(sender,text){
        const log=document.getElementById('chatLog');
        const time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        const d=document.createElement('div');
        d.className=`log-entry ${sender}`;
        d.innerHTML=`${text} <span style="font-size:10px;opacity:0.4;margin-left:6px">${time}</span>`;
        log.appendChild(d);
        log.scrollTop=log.scrollHeight;
    }

    // ===== TTS =====
    function speak(text){
        if(currentAudio){currentAudio.pause();currentAudio=null}
        orbState='speaking';
        document.getElementById('stateLabel').textContent='SPEAKING';
        document.getElementById('tapHint').style.display='none';
        
        fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({text:text,password:PWD})})
        .then(r=>{if(!r.ok)throw new Error();return r.blob()})
        .then(blob=>{
            const url=URL.createObjectURL(blob);
            currentAudio=new Audio(url);
            
            // Connect to analyser for speaking visualization
            if(audioCtx){
                try{
                    const src=audioCtx.createMediaElementSource(currentAudio);
                    if(!analyser)analyser=audioCtx.createAnalyser();
                    analyser.fftSize=256;
                    src.connect(analyser);
                    analyser.connect(audioCtx.destination);
                    updateSpeakLevel();
                }catch(e){}
            }
            
            currentAudio.onended=()=>{stopSpeaking();URL.revokeObjectURL(url);currentAudio=null};
            currentAudio.onerror=()=>{stopSpeaking();currentAudio=null};
            currentAudio.play();
        })
        .catch(()=>{
            // Fallback browser TTS
            if(synth){
                const u=new SpeechSynthesisUtterance(text);u.rate=1.05;u.pitch=1.15;
                u.onend=()=>stopSpeaking();
                synth.speak(u);
            }else{stopSpeaking()}
        });
    }

    function updateSpeakLevel(){
        if(!analyser||orbState!=='speaking')return;
        const data=new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        let sum=0;for(let i=0;i<data.length;i++)sum+=data[i];
        audioLevel=(sum/data.length)/255;
        requestAnimationFrame(updateSpeakLevel);
    }

    function stopSpeaking(){
        if(currentAudio){currentAudio.pause();currentAudio=null}
        if(synth)synth.cancel();
        orbState='idle';audioLevel=0;
        document.getElementById('stateLabel').textContent='READY';
        document.getElementById('tapHint').style.display='block';
    }

    function clearChat(){
        document.getElementById('chatLog').innerHTML='';
        addLog('aira','Fresh start! Tap the orb to talk.');
        fetch('/api/clear-memory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:PWD})});
    }

    // ===== TIMER =====
    function startTimer(){
        const start=Date.now();
        setInterval(()=>{
            const e=Math.floor((Date.now()-start)/1000);
            document.getElementById('timer').textContent=
                Math.floor(e/60).toString().padStart(2,'0')+':'+(e%60).toString().padStart(2,'0');
        },1000);
    }

    if(synth)synth.onvoiceschanged=()=>synth.getVoices();
    </script>
</body>
</html>
